services:
  - type: web
    name: setu-backend
    env: node
    plan: free
    region: oregon
    rootDir: .freebuff/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set this to your Atlas connection string in the Render dashboard:
      # mongodb+srv://<user>:<password>@<cluster>/setu_works
      - key: MONGO_URI
        sync: false
      # After the frontend deploys, set this to its URL, e.g.
      # https://setu-client.vercel.app
      - key: CORS_ORIGINS
        sync: false
